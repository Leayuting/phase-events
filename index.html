<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f6f4">
<title>PHASE 活動系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --fg:#161616; --mut:#6f6f6b; --line:#dcdcd7; --soft:#ecece8;
  --ink:#161616; --onink:#f6f6f4; --warn:#b03a2e; --ok:#2f6b4a; --hold:#8a6a1f;
  --sans:'Inter','Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1a1a19; --fg:#ecebe7; --mut:#9a9994; --line:#2c2c2a; --soft:#232321;
  --ink:#ecebe7; --onink:#121211; --warn:#e07b6b; --ok:#7fb899; --hold:#d1ab55; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1a1a19; --fg:#ecebe7; --mut:#9a9994; --line:#2c2c2a; --soft:#232321;
  --ink:#ecebe7; --onink:#121211; --warn:#e07b6b; --ok:#7fb899; --hold:#d1ab55; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding:0 16px 80px}
.wrap{max-width:1040px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:24px;font-weight:500;letter-spacing:.02em;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font-size:15px;font-weight:600;margin:0 0 6px}
.brand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:500}
header.top{padding:20px 0 0}
.hrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-top:6px}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.who{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.who .nm{font-weight:600}
.mut{color:var(--mut)}
.small{font-size:13px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px;max-width:62ch}
.banner{margin-top:14px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);font-size:13px;border-radius:4px}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.banner.hold{border-color:var(--hold);color:var(--hold)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:16px -16px 0;padding:0 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;font-size:15px;color:var(--mut);cursor:pointer;min-height:44px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ink);font-weight:600}
section.blk{padding:22px 0;border-bottom:1px solid var(--line)}
section.blk:last-child{border-bottom:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:var(--onink);border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:0 16px;min-height:44px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mut);white-space:nowrap;line-height:1.6}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.hold{border-color:var(--hold);color:var(--hold)}
.tag.ink{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--mut)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 10px;min-height:44px;width:100%;min-width:0}
textarea{padding:10px;min-height:96px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right}
tr.grp td{background:var(--soft);font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.06em}
tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
td input[type=number]{width:84px;text-align:right;min-height:40px}
td input[type=text]{min-height:40px}
.empty{padding:20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:4px;font-size:14px}
.log{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log .tm{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;min-width:84px}
.log .tx{flex:1 1 220px;min-width:0}
.log.void .tx{text-decoration:line-through;color:var(--mut)}
.ck{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.ck input[type=checkbox]{width:26px;height:26px;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
.ck .t{font-weight:500}
.ck.done .t{text-decoration:line-through;color:var(--mut)}
.ck .act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.card .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.card .nums div{display:flex;flex-direction:column}
.card .nums b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.card .nums span{font-size:11px;color:var(--mut)}
details>summary{cursor:pointer;list-style:none;padding:8px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'›';display:inline-block;margin-right:6px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.pad{display:block;width:100%;max-width:560px;height:180px;background:#fff;border:1px solid var(--line);border-radius:4px;touch-action:none}
.sigimg{background:#fff;border:1px solid var(--line);border-radius:4px;max-width:240px;height:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--onink);padding:12px 18px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.toast.err{background:var(--warn);color:#fff}
#ver{position:fixed;right:10px;bottom:8px;font-size:11px;color:var(--mut);z-index:40;pointer-events:none}
.login{max-width:420px;margin:12vh auto 0}
.login .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:16px}
.login .names button{min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:16px;cursor:pointer}
.login input[type=password]{font-size:28px;letter-spacing:.4em;text-align:center;min-height:60px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok)}
.dot.off{background:var(--warn)}
.saving{font-size:12px;color:var(--mut)}
.right{margin-left:auto}
.strike{text-decoration:line-through;color:var(--mut)}
.nowrap{white-space:nowrap}
.hint{font-size:12px;color:var(--mut)}
@media (max-width:560px){
  h1{font-size:21px}
  .card .nums b{font-size:18px}
  .ck{grid-template-columns:32px 1fr}
  .ck .act{grid-column:2;justify-content:flex-start}
}
</style>
</head>

          var l = L[s.id] && L[s.id][it.id];
          if (l && l.brew_remaining_g != null) x.brewLeft = { g: l.brew_remaining_g, sheet: s };
        });
        R.item[it.id] = x;
        R.beans.push(it);
        if (x.out != null) T.out += x.out; else T.outMissing++;
        T.rep += x.rep;
        if (x.back != null) T.back += x.back;
        if (x.sold != null) T.sold += x.sold; else T.soldMissing++;
        T.used += x.used; T.tasting += x.tasting;
        x.daily.forEach(function (dd) { if (dd.sold != null) T.day[dd.date] += dd.sold; else T.dayMissing[dd.date]++; });
      } else {
        var y = { plan1: p.plan_batch1, planT: p.plan_total, rep: 0 };
        net.forEach(function (m) { if (m.item_id === it.id && m.type === '補貨') y.rep += m.qty; });
        R.drip[it.id] = y;
        R.drips.push(it);
      }
    });
    T.dripPlan1 = sum(R.drips, function (it) { return R.drip[it.id].plan1; });
    T.dripPlanT = sum(R.drips, function (it) { return R.drip[it.id].planT; });
    T.dripRep = sum(R.drips, function (it) { return R.drip[it.id].rep; });
    T.ratio = (T.soldMissing === 0 && T.out + T.rep > 0) ? T.sold / (T.out + T.rep) : null;
    R.tot = T;

    /* Checklist：每個項目的完成狀態＝它最新一筆勾選紀錄 */
    var lastLog = {};
    D.cklog.forEach(function (l) { lastLog[l.item_id] = l; });
    D.ck.forEach(function (c) {
      var l = lastLog[c.id];
      R.ck[c.id] = (l && l.action === '完成') ? { by: l.person_id, at: l.created_at, mode: l.auth_mode } : null;
      if (!c.archived && stationLive(c.station_id)) { R.ckLive++; if (R.ck[c.id]) R.ckDone++; }
    });

    /* 備料：核對 */
    var today = todayStr();
    D.buys.forEach(function (b) {
      var diff = (b.order_qty != null && b.received_qty != null) ? num(b.received_qty) - num(b.order_qty) : null;
      R.buy[b.id] = { diff: diff, overdue: !!(b.eta && b.eta < today && b.status !== '已到'), short: diff != null && diff < 0 };
    });
    return R;
  }
};

   --------------------------------------------------------------------------- */
var pad = { dirty: false, drawing: false };
function initPad() {
  var c = $('#pad');
  if (!c) return;
  var r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  var x = c.getContext('2d');
  x.scale(dpr, dpr);
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, r.width, r.height);
  x.strokeStyle = '#161616'; x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round';
  pad.dirty = false;
  function pos(e) { var b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  c.onpointerdown = function (e) { e.preventDefault(); pad.drawing = true; try { c.setPointerCapture(e.pointerId); } catch (er) {} var p = pos(e); x.beginPath(); x.moveTo(p[0], p[1]); x.lineTo(p[0] + 0.1, p[1] + 0.1); x.stroke(); pad.dirty = true; };
  c.onpointermove = function (e) { if (!pad.drawing) return; e.preventDefault(); var p = pos(e); x.lineTo(p[0], p[1]); x.stroke(); };
  c.onpointerup = c.onpointercancel = function () { pad.drawing = false; };
}
function padPng() {
  var c = $('#pad');
  var o = document.createElement('canvas');
  var w = 480, h = Math.round(480 * c.height / c.width);
  o.width = w; o.height = h;
  var x = o.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h);
  x.drawImage(c, 0, 0, w, h);
  return o.toDataURL('image/png');
}

function buildDataPayload() {

  });

    items.push({ kind: 'drip', name: n, plan_batch1: D.drip_only_plan, plan_total: D.drip_only_plan, needs_confirm: D.drip_only_note, sort: 1000 + i });
  });
  var checklist = [];

    D.checklist[st].forEach(function (r) { checklist.push({ station: st, phase: '事前', title: r[0], qty: r[1] || null, note: r[2] || null }); });
  });
  var tl = [];
  function add(date, rows) { rows.forEach(function (r) { tl.push({ date: date, phase_label: r[0], time_text: r[1], content: r[2], people: r[3], place: r[4] }); }); }
  add(D.timeline_setup.date, D.timeline_setup.rows);
  var d = D.event.start_date;
  while (d <= D.event.end_date) {
    var isLast = d === D.event.end_date;
    add(d, D.timeline_daily.filter(function (r) { return !(isLast && r[5]); }));
    if (isLast) add(d, D.timeline_last);
    d = addDays(d, 1);
  }

  return { event: D.event, stations: D.stations, items: items, checklist: checklist, timeline: tl };

/* 這些動作由 change 事件觸發，不由 click 觸發 */
var CHANGE_ACTS = ['tick', 'showCalc', 'pMgr', 'pActive', 'pickEvent', 'buyStatus', 'buyRec', 'stDate'];

document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t) return;
  var a = t.getAttribute('data-act');
  if (CHANGE_ACTS.indexOf(a) >= 0) return;
  if (t.disabled) return;
  if (t.tagName === 'BUTTON') ev.preventDefault();
  if (A[a]) A[a](t);
});
function loginFail(d) {
  S.ui.loginMsg = (d.error || '登入失敗') + (d.retry_at ? '，請於 ' + tm(d.retry_at).slice(6) + ' 後再試' : '');
  renderNow();
}
function loginOk(d, oldToken) {
  if (oldToken && oldToken !== d.token) sb.rpc('evt_logout', { p_token: oldToken }).then(function () {}, function () {});
  S.token = d.token; S.me = d.person;
  LS.set(K_TOKEN, d.token); LS.set(K_ME, JSON.stringify(d.person));
  S.ui.loginPid = null; S.ui.loginMsg = ''; S.ui.screen = null;
  afterLogin();
}
document.addEventListener('submit', function (ev) {
  var kind = ev.target.getAttribute('data-form');
  if (!kind) return;
  ev.preventDefault();
  if (kind === 'partner') {
    var pw = val('#pw'), nm = val('#nm').trim();
    if (!isPin6(pw)) { S.ui.loginMsg = '共用密碼是 6 位數字'; renderNow(); return; }
    if (!nm) { S.ui.loginMsg = '請輸入你的名字'; renderNow(); return; }
    sb.rpc('evt_partner_login', { p_password: pw, p_name: nm, p_device: deviceId() }).then(function (r) {
      if (r.error) { handleErr(r.error); return; }
      if (!r.data.ok) { loginFail(r.data); return; }
      LS.set(K_NAME, r.data.person.name);
      loginOk(r.data, S.token);
    }, handleErr);
  } else if (kind === 'admin') {
    var pin = val('#pin');
    if (!pin) return;
    sb.rpc('evt_admin_login', { p_person_id: S.ui.loginPid, p_pin: pin, p_device: deviceId() }).then(function (r) {
      if (r.error) { handleErr(r.error); return; }
      if (!r.data.ok) { loginFail(r.data); return; }
      if (pin.length !== 6) LS.set(K_SHORTPIN, r.data.person.id); else LS.del(K_SHORTPIN);
      loginOk(r.data, S.token);
    }, handleErr);
  } else if (kind === 'switch') {
    var name = val('#nm').trim();
    if (!name) { S.ui.loginMsg = '請輸入名字'; renderNow(); return; }
    if (S.me && S.me.is_manager) {
      sb.rpc('evt_admin_to_partner', { p_token: S.token, p_name: name }).then(function (r) {
        if (r.error) { handleErr(r.error); return; }
        loginOk(r.data, null);
      }, handleErr);
    } else {
      sb.rpc('evt_partner_switch', { p_token: S.token, p_name: name }).then(function (r) {
        if (r.error) { S.ui.loginMsg = r.error.message; if (r.error.hint === 'EVT_AUTH') handleErr(r.error); else renderNow(); return; }
        S.me = r.data; LS.set(K_ME, JSON.stringify(r.data)); LS.set(K_NAME, r.data.name);
        S.ui.screen = null; S.ui.loginMsg = '';
        reload(['people']); toast('已換成 ' + r.data.name);
      }, handleErr);
    }
  }
});

  if (a === 'buyStatus') { call('evt_purchase_update', { p_id: t.getAttribute('data-id'), p: { status: t.value } }, ['buys'], '已更新狀態'); return; }
  if (a === 'buyRec') { call('evt_purchase_update', { p_id: t.getAttribute('data-id'), p: { received_qty: t.value === '' ? null : t.value } }, ['buys'], '已更新實收數量'); return; }
  if (a === 'stDate') { call('evt_station_save', { p: { id: S.ui.st, check_date: t.value } }, ['stations'], '已更新對點日期'); return; }
  var k = t.getAttribute('data-k');
  if (k === 'cdate') { S.ui.cdate = t.value; return; }
  var q = t.getAttribute('data-q');
  if (q) {
    if (q === 'dir') { var pr = t.value.split('→'); S.ui.q.from = pr[0]; S.ui.q.to = pr[1]; }
    else S.ui.q[q] = t.value;
    return;
  }
  var f = t.getAttribute('data-f');
  if (f) { S.ui[f] = t.value; S.ui.logMore = 0; renderNow(); return; }
  var it = t.getAttribute('data-it');
  if (it && isMgr()) {
    var pr2 = it.split('|'), p = { id: pr2[0] };
    p[pr2[1]] = t.value;
    if ((pr2[1] === 'name') && !t.value.trim()) { toast('名稱不能空白', true); renderNow(); return; }
    call('evt_item_save', { p: p }, ['items', 'plan'], '已儲存').then(function (r) { if (!r.ok) renderNow(); });
    return;
  }
  var stn = t.getAttribute('data-stname');
  if (stn && t.value.trim()) { call('evt_station_save', { p: { id: stn, name: t.value.trim() } }, ['stations'], '已更新崗位名稱'); return; }
});
document.addEventListener('input', function (ev) {
  var t = ev.target, d = t.getAttribute('data-line');
  if (d && S.ui.draftId) {
    var pr = d.split('|'), v = t.value === '' ? null : Math.max(0, Math.round(num(t.value)));
    S.ui.dv[pr[0]] = S.ui.dv[pr[0]] || {};
    S.ui.dv[pr[0]][pr[1]] = v;
    var x = S.ui.dv[pr[0]], c = $('#lt-' + pr[0]);
    if (c) c.textContent = (isNum(x.wh) && isNum(x.tb)) ? String(x.wh + x.tb) : '—';
    queueDraftSave(pr[0]);
    return;
  }
  var q = t.getAttribute('data-q');
  if (q && q !== 'item' && q !== 'dir') S.ui.q[q] = t.value;
});
window.addEventListener('beforeunload', function () { if (Object.keys(draftDirty).length) flushDraft(); });

/* ============================================================================
   啟動
   ============================================================================ */
function afterLogin() {
  S.loaded = false;
  renderNow();
  return reload(GLOBAL_KEYS).then(function () {
    var evs = S.G.events;
    if (!S.ev || !byId(evs, S.ev)) {
      var last = LS.get('phase_evt_last_event');
      var pick = (last && byId(evs, last)) || find(evs, function (e) { return e.status === '進行中'; }) || find(evs, function (e) { return e.status === '籌備中'; }) || evs[0];
      S.ev = pick ? pick.id : null;
    }
    if (S.ev) LS.set('phase_evt_last_event', S.ev);
    return S.ev ? reload(EVENT_KEYS) : null;
  }).then(function () {
    S.loaded = true;
    if (!S.ev && isMgr()) S.ui.tab = 'event';
    subscribe();
    renderNow();
  });
}
function boot() {
  readUrl();
  S.R = CALC.build();
  S.token = LS.get(K_TOKEN);
  try { S.me = JSON.parse(LS.get(K_ME) || 'null'); } catch (e) { S.me = null; }
  if (!S.token) { S.me = null; return reload(['people']).then(function () { S.loaded = true; renderNow(); }); }
  return sb.rpc('evt_whoami', { p_token: S.token }).then(function (r) {
    if (r.error) {
      if (r.error.hint === 'EVT_AUTH') { S.token = null; S.me = null; LS.del(K_TOKEN); LS.del(K_ME); return reload(['people']).then(function () { S.loaded = true; renderNow(); }); }
      if (isNetErr(r.error)) { S.offline = true; S.me = null; renderNow(); return; }
      throw r.error;
    }
    S.me = r.data;
    LS.set(K_ME, JSON.stringify(r.data));
    return afterLogin();
  }, function (e) { S.offline = true; S.me = null; renderNow(); });
}
window.EVT_DEBUG = { S: S, CALC: CALC, buildDataPayload: buildDataPayload };
boot();
})();
</script>
